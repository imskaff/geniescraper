name: Extension release

# Pushing a tag like extension-v0.5.0 builds the extension, checks it, and publishes a GitHub release with the zip
# (and its checksum) attached, so anyone can install it without the Chrome Web Store.
on:
  push:
    tags:
      - "extension-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "extension-v$version" ]; then
            echo "Tag $TAG does not match the extension version $version (expected extension-v$version)." >&2
            exit 1
          fi
      - name: Check
        run: npm run check
      - name: Package
        run: npm run package
      - name: Checksum
        run: cd release && sha256sum geniescraper-extension-*.zip > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/geniescraper-extension-*.zip release/SHA256SUMS.txt --title "Géniescraper extension ${TAG#extension-v}" --generate-notes
