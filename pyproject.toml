[project]
name = "geniescraper"
version = "0.3.0"
description = "Scrape Apple Music credits and paste them into Genius with a hotkey assistant."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2",
    "httpx>=0.27.0",
    "keyboard>=0.13.5",
    "pillow>=10.0.0",
    "playwright>=1.44.0",
    "playwright-stealth>=1.0.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyperclip>=1.8.2",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.20",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
timeout = 120
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "browser: needs a local Playwright Chromium but no network",
    "gui: opens the real customtkinter window (needs a desktop session)",
    "live: hits real Apple Music/YouTube/Deezer; run with -m live",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["scraper/roles.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
    "E501",    # long UI strings; formatter handles code
    "RUF001",  # ambiguous unicode in strings: ℗, ×, – are intentional
    "RUF002",
    "RUF003",
    "SIM105",  # contextlib.suppress is not clearer than try/except/pass here
]

[tool.basedpyright]
pythonVersion = "3.10"
pythonPlatform = "Windows"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
